[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapsemem-ai"
version = "0.1.0"
authors = [
  { name="Rohan Dhar" }
]
description = "A zero-overhead, temporal belief-graph memory engine for local AI agents."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ollama>=0.1.0",
]

[project.urls]
"Homepage" = "https://github.com/rohandhar6824/SynapseMem"
"Bug Tracker" = "https://github.com/rohandhar6824/SynapseMem/issues"